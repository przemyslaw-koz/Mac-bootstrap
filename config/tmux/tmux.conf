##### Prefix #####

# Change prefix from Ctrl+b to Ctrl+a
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

##### General #####

# Start window numbering at 1
set -g base-index 1

# Start pane numbering at 1
set -g pane-base-index 1

# Renumber windows after closing one
set -g renumber-windows on

# Faster escape time
set -sg escape-time 10

# Enable mouse support
set -g mouse on

# Automatically reload config
bind r source-file ~/.tmux.conf \; display-message "tmux config reloaded!"

##### Pane management #####

# Split panes using intuitive keys
unbind %
unbind '"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows inherit the current directory
bind c new-window -c "#{pane_current_path}"

# Navigate panes with vim-style keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

##### Copy mode #####

set-window-option -g mode-keys vi

# Start selection with v
bind -T copy-mode-vi v send-keys -X begin-selection

# Copy selection to macOS clipboard with y
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Copy selection with Enter as well
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

##### Copy mode #####

set-window-option -g mode-keys vi
set -g history-limit 100000

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"

##### Plugins #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Automatically save tmux state every 15 minutes
set -g @continuum-save-interval '15'

# Restore the last saved environment when tmux server starts
set -g @continuum-restore 'on'

# TPM must stay at the very bottom of tmux.conf
run '~/.tmux/plugins/tpm/tpm'
