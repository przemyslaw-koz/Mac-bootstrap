# Starship configuration managed by mac-bootstrap

add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$aws\
$kubernetes\
$terraform\
$docker_context\
$python\
$nodejs\
$golang\
$rust\
$cmd_duration\
$line_break\
$character"""

[directory]
truncation_length = 4
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "

[git_status]
format = "([$all_status$ahead_behind]($style) )"

[aws]
symbol = " "
format = "via [$symbol($profile )]($style)"

[kubernetes]
disabled = false
symbol = "󱃾 "
format = "on [$symbol$context]($style) "

[terraform]
symbol = "󱁢 "
format = "via [$symbol$workspace]($style) "

[docker_context]
symbol = " "
format = "via [$symbol$context]($style) "

[cmd_duration]
min_time = 1000
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
